<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Draw the Tic-Tac-Toe grid -->
  <rect x="50" y="0" width="10" height="200" fill="black"/>
  <rect x="150" y="0" width="10" height="200" fill="black"/>
  <rect x="0" y="50" width="200" height="10" fill="black"/>
  <rect x="0" y="150" width="200" height="10" fill="black"/>
  
  <!-- Add X and O markers -->
  <text x="25" y="40" font-family="Arial" font-size="40" fill="red" text-anchor="middle">X</text>
  <text x="75" y="40" font-family="Arial" font-size="40" fill="blue" text-anchor="middle">O</text>
  <text x="125" y="40" font-family="Arial" font-size="40" fill="red" text-anchor="middle">X</text>
  
  <text x="25" y="90" font-family="Arial" font-size="40" fill="blue" text-anchor="middle">O</text>
  <text x="75" y="90" font-family="Arial" font-size="40" fill="red" text-anchor="middle">X</text>
  <text x="125" y="90" font-family="Arial" font-size="40" fill="blue" text-anchor="middle">O</text>
  
  <text x="25" y="140" font-family="Arial" font-size="40" fill="red" text-anchor="middle">X</text>
  <text x="75" y="140" font-family="Arial" font-size="40" fill="blue" text-anchor="middle">O</text>
  <text x="125" y="140" font-family="Arial" font-size="40" fill="red" text-anchor="middle">X</text>
</svg>
